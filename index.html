<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的私密空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--t1:#1a1a1a;--t2:#888;--t3:#bbb;--bd:#e8e8e8;--pk:#e88b9c;--mw:780px}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;background:var(--bg);color:var(--t1);line-height:1.8;-webkit-font-smoothing:antialiased}

nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--bd);margin:0 auto;max-width:var(--mw);position:sticky;top:0;background:var(--bg);z-index:100}
.nlogo{font-size:15px;font-weight:500;color:var(--pk);letter-spacing:.5px}
.nlinks{display:flex;gap:4px}
.nlinks a{text-decoration:none;padding:6px 14px;border-radius:16px;font-size:13px;color:var(--t2);cursor:pointer;transition:all .2s}
.nlinks a:hover{color:var(--t1)}
.nlinks a.ac{color:var(--t1);font-weight:500}

.site{max-width:var(--mw);margin:0 auto;padding:0 24px}

.hero{padding:60px 0 48px}
.hero .greeting{font-size:34px;font-weight:400;margin-bottom:14px;letter-spacing:1px;line-height:1.3;color:var(--pk)}
.hero .desc{font-size:15px;color:var(--t2);max-width:480px;line-height:1.8}

.sections{display:flex;flex-direction:column;margin-bottom:40px}

.sec{display:flex;align-items:baseline;gap:12px;padding:28px 0;border-top:1px solid var(--bd);cursor:pointer;transition:all .2s;text-decoration:none;color:inherit}
.sec:hover{padding-left:6px;border-top-color:var(--pk)}
.sec .icon{flex-shrink:0;width:18px;height:18px;margin-top:2px;color:var(--t3);font-size:13px;display:flex;align-items:center}
.sec .body{flex:1}
.sec .body .st{font-size:16px;font-weight:500;margin-bottom:4px;letter-spacing:.3px;color:var(--t1)}
.sec .body .sd{font-size:14px;color:var(--t2);line-height:1.6}
.sec .body .sl{display:inline-block;margin-top:6px;font-size:12px;color:var(--pk);letter-spacing:.3px}

.page{padding:48px 0 32px}
.page h1{font-size:28px;font-weight:400;margin-bottom:10px;letter-spacing:.8px}
.page .sub{font-size:14px;color:var(--t2);margin-bottom:36px}

.alist{display:flex;flex-direction:column;margin-bottom:40px}
.aitem{padding:22px 0;border-top:1px solid var(--bd);cursor:pointer;transition:all .2s}
.aitem:hover{padding-left:6px;border-top-color:var(--pk)}
.aitem:first-child{border-top:1px solid var(--bd)}
.aitem h3{font-size:16px;font-weight:500;margin-bottom:4px;letter-spacing:.3px}
.aitem .meta{font-size:12px;color:var(--t3);margin-bottom:6px}
.aitem .sum{font-size:14px;color:var(--t2);line-height:1.7}

.adetail{padding:48px 0}
.adetail .back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--t2);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;margin-bottom:36px;letter-spacing:.3px;transition:color .2s}
.adetail .back:hover{color:var(--t1)}
.adetail article{max-width:600px}
.adetail article h1{font-size:28px;font-weight:400;margin-bottom:8px;line-height:1.4;letter-spacing:.8px}
.adetail article .dm{font-size:13px;color:var(--t3);margin-bottom:36px}
.adetail article .ct{font-size:15px;line-height:2;color:var(--t1)}
.adetail article .ct p{margin-bottom:20px}
.adetail article .ct img{max-width:100%;border-radius:6px;margin:24px 0}
.adetail article .ct h2{font-size:20px;font-weight:500;margin:40px 0 16px;letter-spacing:.3px}
.adetail article .ct h3{font-size:17px;font-weight:500;margin:28px 0 12px}

.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;margin-bottom:40px}
.gcard{cursor:pointer;transition:opacity .2s}
.gcard:hover{opacity:.75}
.gcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:4px}
.gcard .info{padding:10px 0}
.gcard .info h4{font-size:14px;font-weight:500;margin-bottom:2px;letter-spacing:.3px}
.gcard .info p{font-size:12px;color:var(--t2)}

.gdetail{padding:48px 0}
.gdetail .back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--t2);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;margin-bottom:36px;letter-spacing:.3px;transition:color .2s}
.gdetail .back:hover{color:var(--t1)}
.gdetail h1{font-size:28px;font-weight:400;margin-bottom:8px;letter-spacing:.8px}
.gdetail .dm{font-size:13px;color:var(--t3);margin-bottom:6px}
.gdetail .gdesc{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.8;max-width:520px}
.gimg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gimg .gi{cursor:pointer;transition:opacity .2s}
.gimg .gi:hover{opacity:.75}
.gimg .gi img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:4px}

.about{padding:48px 0}
.about h1{font-size:28px;font-weight:400;margin-bottom:24px;letter-spacing:.8px}
.about .content{max-width:540px;font-size:15px;line-height:2}
.about .content p{margin-bottom:20px}

.socials{display:flex;gap:20px;margin-top:36px;padding-top:28px;border-top:1px solid var(--bd)}
.socials a{color:var(--t2);font-size:13px;text-decoration:none;transition:color .2s;letter-spacing:.3px}
.socials a:hover{color:var(--t1)}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:10000;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s}
.lb.op{opacity:1;visibility:visible}
.lb img{max-width:90vw;max-height:85vh;border-radius:4px;cursor:default}
.lb .cap{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:13px;background:rgba(255,255,255,.08);padding:6px 18px;border-radius:20px;letter-spacing:.3px}
.lb .cls{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb .cls:hover{background:rgba(255,255,255,.2)}

.ft{padding:36px 0 48px;font-size:12px;color:var(--t3);border-top:1px solid var(--bd);display:flex;justify-content:space-between;letter-spacing:.3px}
.ft a{color:var(--t3);text-decoration:none;transition:color .2s}
.ft a:hover{color:var(--t1)}

@media(max-width:640px){
  nav{padding:16px 12px}
  .nlogo{font-size:14px}
  .nlinks a{font-size:12px;padding:4px 10px}
  .site{padding:0 16px}
  .hero{padding:40px 0 36px}
  .hero .greeting{font-size:26px}
  .page,.adetail,.gdetail,.about{padding:32px 0}
  .page h1,.adetail article h1,.gdetail h1,.about h1{font-size:24px}
}
</style>
</head>
<body>

<nav>
  <span class="nlogo" id="navLogo">我的空间</span>
  <div class="nlinks" id="navLinks">
    <a class="ac" onclick="go('home')">首页</a>
    <a onclick="go('about')">关于</a>
    <a onclick="go('articles')">文章</a>
    <a onclick="go('gallery')">相册</a>
  </div>
</nav>

<div class="site" id="site">
  <div id="pc"></div>
  <footer class="ft">
    <span id="footerLeft">私密空间</span>
    <span id="footerRight">仅授权访问</span>
  </footer>
</div>

<div class="lb" id="lb" onclick="closeLb()">
  <button class="cls" onclick="closeLb()">&times;</button>
  <img src="" alt="" id="lbi">
  <div class="cap" id="lbc"></div>
</div>

<script src="data.js"></script>
<script>
var pg='home';

function go(p){pg=p;document.querySelectorAll('.nlinks a').forEach(function(a,i){var ps=['home','about','articles','gallery'];a.classList.toggle('ac',ps[i]===p)});render();window.scrollTo({top:0,behavior:'instant'})}

function render(){var c=document.getElementById('pc');document.getElementById('navLogo').textContent=S.name;switch(pg){case'home':rHome(c);break;case'about':rAbout(c);break;case'articles':rArticles(c);break;case'gallery':rGallery(c);break}}

function rHome(c){var h='<div class="hero"><div class="greeting">'+S.greeting+'</div><div class="desc">'+S.desc+'</div></div><div class="sections">';
S.sections.forEach(function(s,i){h+='<div class="sec" onclick="go(\''+s.page+'\')"><div class="icon">'+s.icon+'</div><div class="body"><div class="st">'+s.title+'</div><div class="sd">'+s.desc+'</div><div class="sl">'+s.link+'</div></div></div>'});
h+='</div>';c.innerHTML=h}

function rAbout(c){var h='<div class="about"><h1>关于</h1><div class="content">'+S.about+'</div>';if(S.socials&&S.socials.length){h+='<div class="socials">';S.socials.forEach(function(s){h+='<a href="'+s.url+'" target="_blank" rel="noopener">'+s.name+'</a>'});h+='</div>'}h+='</div>';c.innerHTML=h}

function rArticles(c){var h='<div class="page"><h1>文章</h1><div class="sub">共 '+A.length+' 篇</div><div class="alist">';A.forEach(function(a){h+='<div class="aitem" onclick="viewA('+a.id+')"><h3>'+a.title+'</h3><div class="meta">'+a.date+'</div><div class="sum">'+a.summary+'</div></div>'});h+='</div></div>';c.innerHTML=h}

function viewA(id){var a=A.find(function(x){return x.id===id});if(!a)return;document.querySelectorAll('.nlinks a').forEach(function(x){x.classList.remove('ac')});var c=document.getElementById('pc');c.innerHTML='<div class="adetail"><button class="back" onclick="go(\'articles\')">\u2190 返回文章</button><article><h1>'+a.title+'</h1><div class="dm">'+a.date+'</div><div class="ct">'+a.content+'</div></article></div>';window.scrollTo({top:0,behavior:'instant'})}

function rGallery(c){var h='<div class="page"><h1>相册</h1><div class="sub">共 '+G.length+' 个相册</div><div class="ggrid">';G.forEach(function(g){h+='<div class="gcard" onclick="viewG('+g.id+')"><img src="'+g.images[0].url+'" alt="'+g.title+'" loading="lazy"><div class="info"><h4>'+g.title+'</h4><p>'+g.date+' &middot; '+g.images.length+' 张</p></div></div>'});h+='</div></div>';c.innerHTML=h}

function viewG(id){var g=G.find(function(x){return x.id===id});if(!g)return;document.querySelectorAll('.nlinks a').forEach(function(x){x.classList.remove('ac')});var c=document.getElementById('pc');var h='<div class="gdetail"><button class="back" onclick="go(\'gallery\')">\u2190 返回相册</button><h1>'+g.title+'</h1><div class="dm">'+g.date+' &middot; '+g.images.length+' 张照片</div><div class="gdesc">'+g.description+'</div><div class="gimg">';g.images.forEach(function(img){h+='<div class="gi" onclick="event.stopPropagation();openLb(\''+img.url+'\',\''+(img.caption||'')+'\')"><img src="'+img.url+'" alt="'+(img.caption||'')+'" loading="lazy"></div>'});h+='</div></div>';c.innerHTML=h}

function openLb(url,cap){document.getElementById('lbi').src=url;document.getElementById('lbc').textContent=cap||'';document.getElementById('lb').classList.add('op')}
function closeLb(){document.getElementById('lb').classList.remove('op')}

render();
</script>
</body>
</html>
