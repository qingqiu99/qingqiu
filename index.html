<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的私密空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf7f2;--card:#fff;--t1:#2c2416;--t2:#8c8474;--t3:#b8b0a4;--bd:#ebe5d8;--ac:#c4956a;--ac2:#b07d4f;--r:14px;--mw:760px}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;background:var(--bg);color:var(--t1);line-height:1.75;min-height:100vh;-webkit-font-smoothing:antialiased}

.ov{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
.ov.hide{opacity:0;visibility:hidden;pointer-events:none}
.pbox{width:380px;max-width:90vw;text-align:center;padding:48px 36px}
.pbox .icon{margin-bottom:28px;display:inline-block;width:64px;height:64px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center}
.pbox .icon svg{width:28px;height:28px;stroke:#fff}
.pbox h2{font-size:22px;font-weight:500;margin-bottom:10px;letter-spacing:.5px}
.pbox .sub{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.6}
.pbox input{width:100%;padding:14px 18px;font-size:15px;border:1px solid var(--bd);border-radius:10px;outline:none;font-family:inherit;background:var(--bg);transition:border-color .2s;text-align:center;letter-spacing:2px}
.pbox input:focus{border-color:var(--ac);background:var(--card)}
.pbox .err{color:#c06060;font-size:13px;margin-top:10px;min-height:20px}
.pbox button{width:100%;margin-top:20px;padding:14px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.5px}
.pbox button:hover{background:var(--ac2)}

.site{max-width:var(--mw);margin:0 auto;padding:0 24px;display:none}
.site.on{display:block}

nav{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;border-bottom:1px solid var(--bd);margin-bottom:0;position:sticky;top:0;background:var(--bg);z-index:100}
.nlogo{font-size:16px;font-weight:500;color:var(--t1);letter-spacing:.5px}
.nlinks{display:flex;gap:2px}
.nlinks a{text-decoration:none;padding:7px 16px;border-radius:20px;font-size:13px;color:var(--t2);cursor:pointer;transition:all .2s;letter-spacing:.3px}
.nlinks a:hover{color:var(--t1)}
.nlinks a.ac{color:var(--ac);font-weight:500}

.home-hero{padding:56px 0 48px;text-align:center}
.home-hero .greeting{font-size:32px;font-weight:500;margin-bottom:12px;letter-spacing:1px}
.home-hero .desc{font-size:15px;color:var(--t2);max-width:420px;margin:0 auto 36px;line-height:1.8}

.home-sections{display:flex;flex-direction:column;gap:0}

.sec-card{display:block;text-decoration:none;color:inherit;padding:28px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:all .2s}
.sec-card:hover{padding-left:8px}
.sec-card .sec-title{font-size:18px;font-weight:500;margin-bottom:6px;letter-spacing:.3px}
.sec-card .sec-desc{font-size:14px;color:var(--t2);line-height:1.6}
.sec-card .sec-link{display:inline-block;margin-top:8px;font-size:13px;color:var(--ac);letter-spacing:.3px}

.page-title{padding:40px 0 32px}
.page-title h1{font-size:26px;font-weight:500;margin-bottom:8px;letter-spacing:.5px}
.page-title p{font-size:14px;color:var(--t2)}

.agrid{display:flex;flex-direction:column;gap:0;margin-bottom:48px}
.acard{padding:24px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:all .2s}
.acard:hover{padding-left:8px}
.acard h3{font-size:17px;font-weight:500;margin-bottom:6px;letter-spacing:.3px}
.acard .meta{font-size:12px;color:var(--t3);margin-bottom:8px}
.acard .sum{font-size:14px;color:var(--t2);line-height:1.7}

.adetail{margin-bottom:48px}
.adetail .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--t2);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;margin-bottom:32px;letter-spacing:.3px;transition:color .2s}
.adetail .back:hover{color:var(--ac)}
.adetail article{max-width:620px}
.adetail article h1{font-size:26px;font-weight:500;margin-bottom:8px;line-height:1.4;letter-spacing:.5px}
.adetail article .dm{font-size:13px;color:var(--t3);margin-bottom:32px}
.adetail article .ct{font-size:15px;line-height:2;color:var(--t1)}
.adetail article .ct p{margin-bottom:18px}
.adetail article .ct img{max-width:100%;border-radius:var(--r);margin:24px 0}
.adetail article .ct h2{font-size:19px;font-weight:500;margin:36px 0 14px;letter-spacing:.3px}
.adetail article .ct h3{font-size:16px;font-weight:500;margin:28px 0 10px}

.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-bottom:48px}
.gcard{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .25s;border:1px solid var(--bd)}
.gcard:hover{transform:translateY(-3px)}
.gcard img{width:100%;height:200px;object-fit:cover;display:block}
.gcard .info{padding:16px 18px}
.gcard .info h4{font-size:15px;font-weight:500;margin-bottom:4px;letter-spacing:.3px}
.gcard .info p{font-size:13px;color:var(--t2)}

.gdetail{margin-bottom:48px}
.gdetail .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--t2);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;margin-bottom:32px;letter-spacing:.3px;transition:color .2s}
.gdetail .back:hover{color:var(--ac)}
.gdetail h1{font-size:26px;font-weight:500;margin-bottom:8px;letter-spacing:.5px}
.gdetail .dm{font-size:13px;color:var(--t3);margin-bottom:8px}
.gdetail .gdesc{font-size:14px;color:var(--t2);margin-bottom:28px;line-height:1.8}
.gimg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gimg-grid .gi{cursor:pointer;border-radius:var(--r);overflow:hidden;transition:transform .2s}
.gimg-grid .gi:hover{transform:scale(1.02)}
.gimg-grid .gi img{width:100%;height:180px;object-fit:cover;display:block}

.about-page{max-width:560px;margin-bottom:48px}
.about-page h1{font-size:26px;font-weight:500;margin-bottom:24px;letter-spacing:.5px}
.about-page p{font-size:15px;color:var(--t1);line-height:2;margin-bottom:18px}
.about-page .socials{display:flex;gap:16px;margin-top:32px;padding-top:28px;border-top:1px solid var(--bd)}
.about-page .socials a{color:var(--t2);font-size:14px;text-decoration:none;transition:color .2s;letter-spacing:.3px}
.about-page .socials a:hover{color:var(--ac)}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:10000;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s}
.lb.op{opacity:1;visibility:visible}
.lb img{max-width:90vw;max-height:85vh;border-radius:8px;cursor:default}
.lb .cap{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:14px;background:rgba(255,255,255,.1);padding:6px 18px;border-radius:20px;letter-spacing:.3px}
.lb .cls{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.12);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb .cls:hover{background:rgba(255,255,255,.25)}

.ft{padding:32px 0 48px;font-size:12px;color:var(--t3);border-top:1px solid var(--bd);display:flex;justify-content:space-between;letter-spacing:.3px}
.ft a{color:var(--t3);text-decoration:none;transition:color .2s}
.ft a:hover{color:var(--ac)}

@media(max-width:640px){
  .home-hero{padding:40px 0 36px}
  .home-hero .greeting{font-size:26px}
  nav{padding:18px 0 14px}
  .nlogo{font-size:15px}
  .sec-card{padding:22px 0}
  .sec-card .sec-title{font-size:16px}
  .acard{padding:20px 0}
  .ggrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .gcard img{height:150px}
  .gimg-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .gimg-grid .gi img{height:140px}
  .adetail article{max-width:100%}
  .page-title{padding:28px 0 24px}
  .page-title h1{font-size:22px}
  .adetail article h1,.gdetail h1{font-size:22px}
}
</style>
</head>
<body>

<div class="ov" id="ov">
  <div class="pbox">
    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg></div>
    <h2>私密空间</h2>
    <p class="sub">请输密码访续</p>
    <input type="password" id="pi" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkPwd()">
    <p class="err" id="pe"></p>
    <button onclick="checkPwd()">进入</button>
  </div>
</div>

<div class="site" id="sc">
  <nav>
    <span class="nlogo" id="navLogo">我的私密空间</span>
    <div class="nlinks" id="navLinks">
      <a class="ac" onclick="go('home')">首页</a>
      <a onclick="go('articles')">文章</a>
      <a onclick="go('gallery')">相册</a>
      <a onclick="go('about')">关于</a>
    </div>
  </nav>
  <div id="pc"></div>
  <footer class="ft">
    <span>&copy; 2026 私密空间</span>
    <span>仅授权访问</span>
  </footer>
</div>

<div class="lb" id="lb" onclick="closeLb()">
  <button class="cls" onclick="closeLb()">&times;</button>
  <img src="" alt="" id="lbi">
  <div class="cap" id="lbc"></div>
</div>

<script src="data.js"></script>
<script>
var pg='home';

async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}

async function checkPwd(){const v=document.getElementById('pi').value;const e=document.getElementById('pe');if(!v){e.textContent='请输入密码';return}const h=await sha256(v);const eh=await sha256(S.pwd);if(h===eh){sessionStorage.setItem('a',eh);document.getElementById('ov').classList.add('hide');document.getElementById('sc').classList.add('on');document.getElementById('navLogo').textContent=S.name;render()}else{e.textContent='密码错误';document.getElementById('pi').value='';document.getElementById('pi').focus()}}

function go(p){pg=p;document.querySelectorAll('.nlinks a').forEach((a,i)=>{var ps=['home','articles','gallery','about'];a.classList.toggle('ac',ps[i]===p)});render();window.scrollTo({top:0,behavior:'instant'})}

function render(){var c=document.getElementById('pc');switch(pg){case'home':renderHome(c);break;case'articles':renderArticles(c);break;case'gallery':renderGallery(c);break;case'about':renderAbout(c);break}}

function renderHome(c){var h='<div class="home-hero"><div class="greeting">'+S.greeting||'你好，</div><div class="desc">'+S.desc+'</div></div><div class="home-sections">';h+='<div class="sec-card" onclick="go(\'articles\')"><div class="sec-title">文章</div><div class="sec-desc">记录思考与生活点滴，用文字整理心中的风景。</div><div class="sec-link">查看全部 '+A.length+' 篇</div></div>';h+='<div class="sec-card" onclick="go(\'gallery\')"><div class="sec-title">相册</div><div class="sec-desc">用影像定格每一个值得记住的瞬间。</div><div class="sec-link">查看全部 '+G.length+' 个相册</div></div>';h+='<div class="sec-card" onclick="go(\'about\')"><div class="sec-title">关于</div><div class="sec-desc">关于这个空间，以及空间的主人。</div><div class="sec-link">了解更多</div></div>';h+='</div>';c.innerHTML=h}

function renderArticles(c){var h='<div class="page-title"><h1>文章</h1><p>共 '+A.length+' 篇</p></div><div class="agrid">';A.forEach(function(a){h+='<div class="acard" onclick="viewA('+a.id+')"><h3>'+a.title+'</h3><div class="meta">'+a.date+'</div><div class="sum">'+a.summary+'</div></div>'});h+='</div>';c.innerHTML=h}

function viewA(id){var a=A.find(function(x){return x.id===id});if(!a)return;document.querySelectorAll('.nlinks a').forEach(function(x){x.classList.remove('ac')});var c=document.getElementById('pc');c.innerHTML='<div class="adetail"><button class="back" onclick="go(\'articles\')">\u2190 返回文章</button><article><h1>'+a.title+'</h1><div class="dm">'+a.date+'</div><div class="ct">'+a.content+'</div></article></div>';window.scrollTo({top:0,behavior:'instant'})}

function renderGallery(c){var h='<div class="page-title"><h1>相册</h1><p>共 '+G.length+' 个相册</p></div><div class="ggrid">';G.forEach(function(g){h+='<div class="gcard" onclick="viewG('+g.id+')"><img src="'+g.images[0].url+'" alt="'+g.title+'" loading="lazy"><div class="info"><h4>'+g.title+'</h4><p>'+g.date+' \u00b7 '+g.images.length+' \u5f20</p></div></div>'});h+='</div>';c.innerHTML=h}

function viewG(id){var g=G.find(function(x){return x.id===id});if(!g)return;document.querySelectorAll('.nlinks a').forEach(function(x){x.classList.remove('ac')});var c=document.getElementById('pc');var h='<div class="gdetail"><button class="back" onclick="go(\'gallery\')">\u2190 返回相册</button><h1>'+g.title+'</h1><div class="dm">'+g.date+' \u00b7 '+g.images.length+' \u5f20\u7167\u7247</div><div class="gdesc">'+g.description+'</div><div class="gimg-grid">';g.images.forEach(function(img){h+='<div class="gi" onclick="event.stopPropagation();openLb(\''+img.url+'\',\''+(img.caption||'')+'\')"><img src="'+img.url+'" alt="'+(img.caption||'')+'" loading="lazy"></div>'});h+='</div></div>';c.innerHTML=h}

function renderAbout(c){var h='<div class="page-title"><h1>关于</h1></div><div class="about-page">';h+='<p>'+S.about+'</p>';if(S.socials&&S.socials.length>0){h+='<div class="socials">';S.socials.forEach(function(s){h+='<a href="'+s.url+'" target="_blank" rel="noopener">'+s.name+'</a>'});h+='</div>'}h+='</div>';c.innerHTML=h}

function openLb(url,cap){document.getElementById('lbi').src=url;document.getElementById('lbc').textContent=cap||'';document.getElementById('lb').classList.add('op')}
function closeLb(){document.getElementById('lb').classList.remove('op')}

(function init(){
  var h=sessionStorage.getItem('a');
  if(h){sha256(S.pwd).then(function(eh){if(h===eh){document.getElementById('ov').classList.add('hide');document.getElementById('sc').classList.add('on');document.getElementById('navLogo').textContent=S.name;render();return}})}
  document.getElementById('pi').focus();
})();
</script>
</body>
</html>
