<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#f8f9fa;--t1:#1a1a2e;--t2:#6b7280;--t3:#9ca3af;--bd:#e5e7eb;--ac:#2563eb;--ac2:#1d4ed8;--ca:#fff;--sh:0 1px 3px rgba(0,0,0,.08);--r:12px;--mw:900px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg2);color:var(--t1);line-height:1.7;min-height:100vh}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .4s,visibility .4s}
.ov.hide{opacity:0;visibility:hidden;pointer-events:none}
.pbox{width:360px;max-width:90vw;padding:40px 32px;text-align:center}
.pbox .ic{width:56px;height:56px;border-radius:14px;background:var(--ac);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.pbox .ic svg{width:28px;height:28px;stroke:#fff}
.pbox h2{font-size:20px;font-weight:600;margin-bottom:8px}
.pbox p{font-size:14px;color:var(--t2);margin-bottom:24px}
.pbox input{width:100%;padding:12px 16px;font-size:15px;border:1.5px solid var(--bd);border-radius:10px;outline:none;font-family:inherit;transition:border-color .2s}
.pbox input:focus{border-color:var(--ac)}
.pbox .err{color:#dc2626;font-size:13px;margin-top:8px;min-height:20px}
.pbox button{width:100%;margin-top:16px;padding:12px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s;font-family:inherit}
.pbox button:hover{background:var(--ac2)}
.site{max-width:var(--mw);margin:0 auto;padding:0 20px;display:none}
.site.on{display:block}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--bd);margin-bottom:32px;position:sticky;top:0;background:var(--bg2);z-index:100}
.nlogo{font-size:17px;font-weight:600;color:var(--t1)}
.nlinks{display:flex;gap:4px}
.nlinks a{text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--t2);cursor:pointer;transition:all .2s}
.nlinks a:hover{color:var(--t1);background:#e5e7eb}
.nlinks a.ac{color:var(--ac);background:#dbeafe;font-weight:500}
.hero{text-align:center;padding:40px 20px 32px;background:var(--ca);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:32px}
.hero h1{font-size:26px;font-weight:700;margin-bottom:10px}
.hero p{font-size:15px;color:var(--t2);max-width:500px;margin:0 auto}
.st{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.st .dot{width:6px;height:6px;border-radius:50%;background:var(--ac);display:inline-block}
.agrid{display:grid;gap:16px;margin-bottom:40px}
.acard{background:var(--ca);border:1px solid var(--bd);border-radius:var(--r);padding:20px 24px;cursor:pointer;transition:all .2s}
.acard:hover{border-color:var(--ac);box-shadow:var(--sh)}
.acard h3{font-size:17px;font-weight:600;margin-bottom:6px}
.acard .meta{font-size:12px;color:var(--t3);margin-bottom:10px}
.acard .sum{font-size:14px;color:var(--t2);line-height:1.6}
.adetail{margin-bottom:40px}
.adetail .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--t2);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;margin-bottom:20px}
.adetail .back:hover{color:var(--ac)}
.adetail h1{font-size:26px;font-weight:700;margin-bottom:8px;line-height:1.4}
.adetail .dm{font-size:13px;color:var(--t3);margin-bottom:24px}
.adetail .ct{font-size:15px;line-height:1.9}
.adetail .ct p{margin-bottom:16px}
.adetail .ct img{max-width:100%;border-radius:10px;margin:16px 0}
.adetail .ct h2{font-size:20px;font-weight:600;margin:28px 0 12px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:40px}
.gcard{background:var(--ca);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s}
.gcard:hover{border-color:var(--ac);box-shadow:var(--sh)}
.gcard img{width:100%;height:180px;object-fit:cover;display:block}
.gcard .info{padding:14px 16px}
.gcard .info h4{font-size:15px;font-weight:600;margin-bottom:4px}
.gcard .info p{font-size:13px;color:var(--t2)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10000;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s}
.lb.op{opacity:1;visibility:visible}
.lb img{max-width:90vw;max-height:85vh;border-radius:8px;cursor:default}
.lb .cap{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:14px;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:20px}
.lb .cls{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb .cls:hover{background:rgba(255,255,255,.3)}
.ft{text-align:center;padding:24px 0 40px;font-size:12px;color:var(--t3);border-top:1px solid var(--bd)}
.ggrid-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:32px}
.ggrid-img .gi{cursor:pointer;border-radius:10px;overflow:hidden;transition:transform .2s}
.ggrid-img .gi:hover{transform:scale(1.02)}
.ggrid-img .gi img{width:100%;height:160px;object-fit:cover;display:block}
@media(max-width:640px){.hero{padding:28px 16px 24px}.hero h1{font-size:22px}.acard{padding:16px 18px}.ggrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.gcard img{height:140px}nav{padding:14px 0}.ggrid-img{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.ggrid-img .gi img{height:130px}}
</style>
</head>
<body>

<div class="ov" id="ov">
  <div class="pbox">
    <div class="ic"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg></div>
    <h2>需要密码访问</h2>
    <p>私密空间，请输入密码继续</p>
    <input type="password" id="pi" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkPwd()">
    <p class="err" id="pe"></p>
    <button onclick="checkPwd()">进入</button>
  </div>
</div>

<div class="site" id="sc">
  <nav>
    <span class="nlogo">我的知识库</span>
    <div class="nlinks">
      <a class="ac" onclick="go('home')">首页</a>
      <a onclick="go('articles')">文章</a>
      <a onclick="go('gallery')">相册</a>
    </div>
  </nav>
  <div id="pc"></div>
  <footer class="ft">私密空间 — 仅授权访问</footer>
</div>

<div class="lb" id="lb" onclick="closeLb()">
  <button class="cls" onclick="closeLb()">&times;</button>
  <img src="" alt="" id="lbi">
  <div class="cap" id="lbc"></div>
</div>

<script src="data.js"></script>
<script>
let pg='home';

async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);const a=Array.from(new Uint8Array(h));return a.map(x=>x.toString(16).padStart(2,'0')).join('')}

async function checkPwd(){const v=document.getElementById('pi').value;const e=document.getElementById('pe');if(!v){e.textContent='请输入密码';return}const h=await sha256(v);const eh=await sha256(S.pwd);if(h===eh){sessionStorage.setItem('a',eh);document.getElementById('ov').classList.add('hide');document.getElementById('sc').classList.add('on');render()}else{e.textContent='密码错误';document.getElementById('pi').value='';document.getElementById('pi').focus()}}

function go(p){pg=p;document.querySelectorAll('.nlinks a').forEach((a,i)=>{const ps=['home','articles','gallery'];a.classList.toggle('ac',ps[i]===p)});render();window.scrollTo({top:0,behavior:'smooth'})}

function render(){const c=document.getElementById('pc');if(pg==='home')renderHome(c);else if(pg==='articles')renderArticles(c);else if(pg==='gallery')renderGalleryList(c)}

function renderHome(c){const ra=A.slice(0,3);const rg=G.slice(0,2);let h=`<div class="hero"><h1>${S.name}</h1><p>${S.desc}</p></div><div class="st"><span class="dot"></span>最近文章</div><div class="agrid">`;ra.forEach(a=>{h+=`<div class="acard" onclick="viewA(${a.id})"><h3>${a.title}</h3><div class="meta">${a.date}</div><div class="sum">${a.summary}</div></div>`});h+='</div>';if(A.length>3)h+=`<p style="text-align:center;margin-bottom:32px"><a onclick="go('articles')" style="color:var(--ac);cursor:pointer;font-size:14px">查看全部 ${A.length} 篇文章</a></p>`;h+=`<div class="st"><span class="dot"></span>精选相册</div><div class="ggrid">`;rg.forEach(g=>{h+=`<div class="gcard" onclick="viewG(${g.id})"><img src="${g.images[0].url}" alt="${g.title}" loading="lazy"><div class="info"><h4>${g.title}</h4><p>${g.images.length} 张照片</p></div></div>`});h+='</div>';if(G.length>2)h+=`<p style="text-align:center"><a onclick="go('gallery')" style="color:var(--ac);cursor:pointer;font-size:14px">查看全部相册</a></p>`;c.innerHTML=h}

function renderArticles(c){let h=`<div class="hero" style="padding:28px 20px 24px"><h1 style="font-size:22px">文章</h1><p>共 ${A.length} 篇</p></div><div class="agrid">`;A.forEach(a=>{h+=`<div class="acard" onclick="viewA(${a.id})"><h3>${a.title}</h3><div class="meta">${a.date}</div><div class="sum">${a.summary}</div></div>`});h+='</div>';c.innerHTML=h}

function viewA(id){const a=A.find(x=>x.id===id);if(!a)return;document.querySelectorAll('.nlinks a').forEach(x=>x.classList.remove('ac'));const c=document.getElementById('pc');c.innerHTML=`<div class="adetail"><button class="back" onclick="go('articles')">← 返回文章列表</button><h1>${a.title}</h1><div class="dm">${a.date}</div><div class="ct">${a.content}</div></div>`;window.scrollTo({top:0,behavior:'smooth'})}

function renderGalleryList(c){let h=`<div class="hero" style="padding:28px 20px 24px"><h1 style="font-size:22px">相册</h1><p>共 ${G.length} 个相册</p></div><div class="ggrid">`;G.forEach(g=>{h+=`<div class="gcard" onclick="viewG(${g.id})"><img src="${g.images[0].url}" alt="${g.title}" loading="lazy"><div class="info"><h4>${g.title}</h4><p>${g.date} · ${g.images.length} 张</p></div></div>`});h+='</div>';c.innerHTML=h}

function viewG(id){const g=G.find(x=>x.id===id);if(!g)return;document.querySelectorAll('.nlinks a').forEach(x=>x.classList.remove('ac'));const c=document.getElementById('pc');let h=`<div class="adetail"><button class="back" onclick="go('gallery')">← 返回相册</button><h1>${g.title}</h1><div class="dm">${g.date} · ${g.images.length} 张照片</div><p style="color:var(--t2);margin-bottom:20px">${g.description}</p><div class="ggrid-img">`;g.images.forEach((img,i)=>{h+=`<div class="gi" onclick="openLb('${img.url}','${img.caption}')"><img src="${img.url}" alt="${img.caption||''}" loading="lazy"></div>`});h+='</div></div>';c.innerHTML=h}

function openLb(url,cap){document.getElementById('lbi').src=url;document.getElementById('lbc').textContent=cap||'';document.getElementById('lb').classList.add('op')}
function closeLb(){document.getElementById('lb').classList.remove('op')}

// init
(async function(){
const h=sessionStorage.getItem('a');
if(h){const eh=await sha256(S.pwd);if(h===eh){document.getElementById('ov').classList.add('hide');document.getElementById('sc').classList.add('on');render();return}}
document.getElementById('pi').focus();
})();
</script>
</body>
</html>
