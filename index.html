<script>
/* 错误抓取器（必须在所有脚本之前）：任何 JS 错误都会显示在页面底部红条上 */
window.__errs=[];
window.addEventListener('error',function(e){
  if(!e.message)return; /* 忽略资源加载失败 */
  var msg=(e.message||'未知错误')+(e.filename?' ['+(e.filename.split('/').pop()||'')+':'+(e.lineno||0)+']':'');
  window.__errs.push(msg);
  window.__showErr();
},true);
window.addEventListener('unhandledrejection',function(e){
  var msg='Promise: '+((e.reason&&e.reason.message)||e.reason);
  window.__errs.push(msg);
  window.__showErr();
});
window.__showErr=function(){
  var d=document.getElementById('__err');
  if(!d){
    d=document.createElement('div');
    d.id='__err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c0392b;color:#fff;padding:10px 14px;font:13px/1.6 monospace;white-space:pre-wrap;word-break:break-all';
    (document.body||document.documentElement).appendChild(d);
  }
  d.textContent='⚠ 页面出错：\n'+window.__errs.join('\n');
};
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}

.bg-img{position:absolute;inset:-5%;background:url('images/bg.jpg') center/cover no-repeat;animation:bgDrift 30s ease-in-out infinite alternate}

.bg-orb{position:absolute;border-radius:50%;filter:blur(60px)}

.bg-orb:nth-child(3){width:280px;height:280px;background:rgba(160,100,240,.5);top:50%;right:8%;animation:orb2 16s ease-in-out infinite}

.bg-orb:nth-child(5){width:250px;height:250px;background:rgba(120,150,240,.45);top:30%;left:60%;animation:orb4 20s ease-in-out infinite}
@keyframes orb1{0%{transform:translate(0,0) scale(1)}20%{transform:translate(80px,-40px) scale(1.2)}40%{transform:translate(-30px,50px) scale(.85)}55%{transform:translate(-60px,-20px) scale(1.1)}75%{transform:translate(40px,30px) scale(.9)}100%{transform:translate(0,0) scale(1)}}
@keyframes orb2{0%{transform:translate(0,0) scale(1.1)}18%{transform:translate(-70px,30px) scale(.85)}38%{transform:translate(20px,-50px) scale(1.15)}58%{transform:translate(60px,10px) scale(.9)}78%{transform:translate(-40px,-30px) scale(1.05)}100%{transform:translate(0,0) scale(1.1)}}
@keyframes orb3{0%{transform:translate(0,0) scale(.9)}25%{transform:translate(-50px,60px) scale(1.15)}50%{transform:translate(40px,-30px) scale(.8)}70%{transform:translate(70px,20px) scale(1.1)}100%{transform:translate(0,0) scale(.9)}}
@keyframes orb4{0%{transform:translate(0,0) scale(1.05)}22%{transform:translate(50px,40px) scale(.85)}45%{transform:translate(-60px,-50px) scale(1.2)}65%{transform:translate(30px,-20px) scale(.9)}88%{transform:translate(-40px,50px) scale(1.05)}100%{transform:translate(0,0) scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

}

<script>
var pg='home',hist=[];

function go(p){hist.push(pg);pg=p;history.pushState({hist:hist.slice(),pg:pg},'','#'+p);updateNav();render();window.scrollTo({top:0,behavior:'instant'})}
function back(){history.back()}
function updateNav(){document.querySelectorAll('.nlinks a').forEach(function(a,i){var ps=['home'];a.classList.toggle('ac',ps[i]===pg)});document.getElementById('navLogo').textContent=S.name}

function rSec(c,page){for(var i=0;i<S.sections.length;i++){if(S.sections[i].page===page){rManual(c,window[S.sections[i].list],S.sections[i].title,S.sections[i].list);return}}}

function render(){var c=document.getElementById('pc');document.getElementById('navLogo').textContent=S.name;switch(pg){case'home':rHome(c);break;case'links':rLinks(c);break;case'advert':rAdvert(c);break;case'about':rAbout(c);break;case'articles':rSec(c,'articles');break;case'books':rBooks(c);break;case'femArticles':rSec(c,'femArticles');break;case'footArticles':rSec(c,'footArticles');break;case'pleasureArticles':rSec(c,'pleasureArticles');break;case'gallery':rGallery(c);break;default:c.innerHTML='<div class="page"><button class="back" onclick="back()">\u2190 返回</button><h1>页面不存在</h1></div>'}requestAnimationFrame(function(){requestAnimationFrame(observeAnims)})}

var animObs;
function observeAnims(){
  if(animObs)animObs.disconnect();
  var pc=document.getElementById('pc'),seen=new Set(),els=[];
  function add(el){if(!seen.has(el)){seen.add(el);els.push(el)}}
  // Level 1-2: page sections and their direct children
  Array.from(pc.children).forEach(function(section){
    Array.from(section.children).forEach(add);
  });
  // Level 3: items inside grid/list containers + article content
  pc.querySelectorAll('.sections .sec,.alist .aitem,.ggrid .gcard,.gimg .gi,.links-row,.links-section-title,.adbtn,.tribute-btn,.row1,.row2,.ct > *,.content > *').forEach(add);
  
  animObs=new IntersectionObserver(function(es){
    var batch=[];
    es.forEach(function(e){if(e.isIntersecting){batch.push(e.target);animObs.unobserve(e.target)}});
    if(batch.length){
      requestAnimationFrame(function(){
        batch.forEach(function(el,i){el.style.transitionDelay=(i*.03)+'s';el.classList.add('anim-show')})
      })
    }
  },{threshold:.05,rootMargin:'0px 0px -30px 0px'});
  els.forEach(function(el){el.classList.add('anim-fade');animObs.observe(el)})
}

function rHome(c){var h='<div class="hero"><div class="hero-title">'+S.name+'</div><div style="display:flex;align-items:center;gap:18px;justify-content:center"><img class="hero-avatar" style="margin-bottom:0;flex-shrink:0" src="'+S.home.avatar+'" alt="avatar"><div class="desc" style="text-align:left;flex:1;max-width:430px">'+S.desc+'</div></div><hr style="border:none;border-top:1px solid #7EC8E3;margin:18px 0 0;opacity:.5"></div><div class="sec" style="gap:12px;cursor:default" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="flex:1;min-width:0;text-align:left;font-size:16px;font-weight:600;letter-spacing:1px;background:linear-gradient(135deg,#c77dff,#f0b0d8,#7EC8E3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">'+S.home.interact.title+'</div><a class="tribute-btn" href="javascript:void(0)" style="flex-shrink:0;white-space:nowrap;padding:4px 14px;font-size:12px" onclick="event.stopPropagation();go(\'links\')">'+S.home.linksBtn+'</a></div><div style="font-size:13px;color:var(--t2);line-height:1.8;margin:8px 0 0">'+S.home.interact.desc1+'<hr style=\"border:none;border-top:1px solid #7EC8E3;margin:12px 0;opacity:.5\">'+S.home.interact.desc2+'</div><a class="adbtn" href="javascript:void(0)" style="margin-top:4px;align-self:center;white-space:normal;text-align:left;line-height:1.3" onclick="event.stopPropagation();go(\'advert\')"><img src="images/hjgjh.jpg" alt="AD" class="adicon" style="width:32px;height:32px"><span style="display:flex;flex-direction:column;align-items:center"><span>'+S.home.adBtn1+'</span><span>'+S.home.adBtn2+'</span></span></a></div><div class="sec" style="gap:12px;cursor:default" onclick="event.stopPropagation()"><div style="font-size:16px;font-weight:600;letter-spacing:1px;background:linear-gradient(135deg,#c77dff,#f0b0d8,#7EC8E3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">'+S.home.selfIntro.title+'</div><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:13px;color:var(--t2);line-height:1.5">'+S.home.selfIntro.desc+'</div><a class="tribute-btn" href="javascript:void(0)" style="flex-shrink:0;margin-left:12px" onclick="event.stopPropagation();go(\'about\')">'+S.home.aboutBtn+'</a></div><hr style="border:none;border-top:1px solid #7EC8E3;margin:0;opacity:.5"><div style="font-size:16px;font-weight:600;letter-spacing:1px;background:linear-gradient(135deg,#c77dff,#f0b0d8,#7EC8E3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">'+S.home.account.title+'</div><div style="font-size:13px;color:var(--t2);line-height:1.5">'+S.home.account.desc+'</div><hr style="border:none;border-top:1px solid #7EC8E3;margin:0;opacity:.5"></div><div class="sec" style="gap:12px;cursor:default" onclick="event.stopPropagation()"><div style="font-size:16px;font-weight:600;letter-spacing:1px;text-align:center;background:linear-gradient(135deg,#c77dff,#f0b0d8,#7EC8E3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">'+S.home.manualTitle+'</div><a class="tribute-btn" href="javascript:void(0)" style="display:block;text-align:center" onclick="event.stopPropagation();go(\'books\')">'+S.home.manualBtn+'</a></div>';
h+='</div>';c.innerHTML=h}

function rBooks(c){var h='<div class="page"><button class="back" onclick="back()">\u2190 返回</button><h1>清秋大小姐的全部经验手册</h1><div class="sub">共 '+S.sections.length+' 本手册</div><div class="sections" style="margin-bottom:0">';S.sections.forEach(function(s){h+='<div class="sec" onclick="go(\''+s.page+'\')"><div class="row1"><div class="left"><div class="icn">'+s.icon+'</div><div class="st">'+s.title+'</div></div><button class="btn">'+s.link+'</button></div></div>'});h+='</div></div>';c.innerHTML=h}

function rManual(c,list,title,key){var h='<div class="page"><button class="back" onclick="back()">\u2190 返回</button><h1>'+title+'</h1><div class="sub">共 '+list.length+' 篇</div><div class="alist">';list.forEach(function(a){h+='<div class="aitem" onclick="viewBy(\''+key+'\','+a.id+')">'+a.title+'</div>'});h+='</div></div>';c.innerHTML=h}

function viewBy(key,id){var a=window[key].find(function(x){return x.id===id});if(!a)return;hist.push(pg);pg='view'+key+id;history.pushState({hist:hist.slice(),pg:pg},'','#'+key+id);document.querySelectorAll('.nlinks a').forEach(function(x){x.classList.remove('ac')});var c=document.getElementById('pc');c.innerHTML='<div class="adetail"><button class="back" onclick="back()">\u2190 返回</button><article><h1>'+a.title+'</h1><div class="ct">'+a.content+'</div></article></div>';window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(function(){requestAnimationFrame(observeAnims)})}

function rGallery(c){var h='<div class="page"><button class="back" onclick="back()">\u2190 返回</button><h1>相册</h1><div class="sub">共 '+G.length+' 个相册</div><div class="ggrid">';G.forEach(function(g){h+='<div class="gcard" onclick="viewG('+g.id+')"><img src="'+g.images[0].url+'" alt="'+g.title+'" loading="lazy"><div class="info"><h4>'+g.title+'</h4><p>'+g.date+' &middot; '+g.images.length+' 张</p></div></div>'});h+='</div></div>';c.innerHTML=h}

function viewG(id){var g=G.find(function(x){return x.id===id});if(!g)return;hist.push(pg);pg='viewG'+id;history.pushState({hist:hist.slice(),pg:pg},'','#gallery'+id);document.querySelectorAll('.nlinks a').forEach(function(x){x.classList.remove('ac')});var c=document.getElementById('pc');var h='<div class="gdetail"><button class="back" onclick="back()">\u2190 返回</button><h1>'+g.title+'</h1><div class="dm">'+g.date+' &middot; '+g.images.length+' 张照片</div><div class="gdesc">'+g.description+'</div><div class="gimg">';g.images.forEach(function(img){h+='<div class="gi" onclick="event.stopPropagation();openLb(\''+img.url+'\',\''+(img.caption||'')+'\')"><img src="'+img.url+'" alt="'+(img.caption||'')+'" loading="lazy"></div>'});h+='</div></div>';c.innerHTML=h;requestAnimationFrame(function(){requestAnimationFrame(observeAnims)})}

function openLb(url,cap){document.getElementById('lbi').src=url;document.getElementById('lbc').textContent=cap||'';document.getElementById('lb').classList.add('op')}

try{history.replaceState({hist:[],pg:'home'},'','#home')}catch(e){window.__errs.push('replaceState: '+e.message);window.__showErr()}
window.addEventListener('popstate',function(e){var s=e.state;if(s){hist=s.hist;pg=s.pg}else{hist=[];pg='home'}updateNav();render();window.scrollTo({top:0,behavior:'instant'})});

try{render()}catch(e){window.__errs.push('render() 报错: '+e.message+' (行:'+(e.lineNumber||'?')+')');window.__showErr();throw e}
</script>
<audio id="bgm" preload="auto"></audio>
<div style="position:fixed;top:16px;right:16px;z-index:999;display:flex;align-items:center;gap:8px">
<div id="bgmPlayBtn" onclick="toggleBgm()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none">
<svg id="bgmIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0b0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
</div>
<div id="bgmSwapBtn" onclick="randomBgm()" style="padding:6px 18px;border-radius:50px;background:#7EC8E3;color:#fff;font-size:13px;font-weight:500;letter-spacing:.3px;cursor:pointer;user-select:none;white-space:nowrap;transition:all .2s" onmouseenter="this.style.background='var(--pk)';this.style.animation='shake .3s ease-in-out'" onmouseleave="this.style.background='#7EC8E3';this.style.animation='none'">随机换曲</div>
</div>
<script>
var bgmList=S.bgmList;
// 双缓冲：bgmA 正在播，bgmB 在后台预载下一首，播完瞬间无缝切换（解决切歌空档）
var bgmA=document.getElementById('bgm');
var bgmB=document.createElement('audio');bgmB.preload='auto';bgmB.style.display='none';document.body.appendChild(bgmB);
var bgmCur=bgmA,bgmNext=bgmB;
var bgmPlayBtn=document.getElementById('bgmPlayBtn');
var bgmIcon=document.getElementById('bgmIcon');
var bgmPlaying=false;
var bgmBlocked=false;
var bgmOverlayShown=false;
function setPlayState(p){bgmPlaying=p;if(p){bgmIcon.style.stroke='#7EC8E3';bgmPlayBtn.style.animation='spin 3s linear infinite'}else{bgmIcon.style.stroke='#f0b0d8';bgmPlayBtn.style.animation='none'}}

// 不重复随机队列
var bgmQueue=[];
function shuffleQueue(){
  bgmQueue=bgmList.slice();
  for(var i=bgmQueue.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=bgmQueue[i];bgmQueue[i]=bgmQueue[j];bgmQueue[j]=tmp;
  }
}
function pickBgm(){
  if(bgmQueue.length===0)shuffleQueue();
  return bgmQueue.pop();
}

// 让缓冲元素预载下一首（当前歌播放期间慢慢下载，切歌时已就绪）
function preloadNext(){
  bgmNext.src=pickBgm();
  bgmNext.volume=0.4;
  bgmNext.load();
}
// 播放当前元素；成功播放后立刻预载下一首
function startCur(){
  var el=bgmCur;
  el.volume=0.4;
  bgmBlocked=false;
  el.play().then(function(){
    setPlayState(true);hideOverlay();preloadNext();
  }).catch(function(e){
    setPlayState(false);
    if(e.name==='NotAllowedError'){
      if(!bgmOverlayShown)showOverlay();
      // 自动切歌被拦截时延迟重试
      else setTimeout(function(){el.play().then(function(){setPlayState(true);preloadNext()}).catch(function(){})},500);
    }
  });
}
// 一首播完：缓冲元素顶上来播放，原元素转为预载角色（零空档）
function advance(){
  var old=bgmCur;bgmCur=bgmNext;bgmNext=old;
  startCur();
}
function playBgm(){
  bgmCur.src=pickBgm();
  startCur();
}
function randomBgm(){playBgm()}
function toggleBgm(){if(bgmPlaying){bgmCur.pause();setPlayState(false)}else{bgmCur.play().then(function(){setPlayState(true);preloadNext()}).catch(function(){})}}
bgmA.addEventListener('ended',advance);
bgmB.addEventListener('ended',advance);

// 浏览器拦截自动播放时显示遮罩
var overlayEl=null;
function showOverlay(){
  bgmBlocked=true;bgmOverlayShown=true;
  if(overlayEl)return;
  overlayEl=document.createElement('div');
  overlayEl.id='bgmOverlay';
  overlayEl.innerHTML='<div style="background:rgba(0,0,0,.55);border-radius:20px;padding:32px 40px;text-align:center;color:#fff;backdrop-filter:blur(20px)"><div style="font-size:40px;margin-bottom:12px">🎵</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">点击任意位置开始播放音乐</div><div style="font-size:13px;opacity:.7">浏览器需要用户交互后才能播放音频</div></div>';
  overlayEl.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer';
  overlayEl.onclick=function(e){e.stopPropagation();hideOverlay();playBgm()};
  document.body.appendChild(overlayEl);
}
function hideOverlay(){
  bgmBlocked=false;
  if(overlayEl){overlayEl.remove();overlayEl=null}
}
playBgm();

var styleEl=document.createElement('style');styleEl.textContent='@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}';document.head.appendChild(styleEl);
</script>
<script>
/* 诊断显示屏：1.5 秒后检查内容区域，若为空则显示原因 */
(function(){
  setTimeout(function(){
    var pc=document.getElementById('pc');
    if(!pc||!pc.innerHTML){
      var msg;
      if(typeof S==='undefined'){msg='data.js 没有加载成功（可能被浏览器拦截）'}
      else if(typeof render==='undefined'){msg='页面脚本没有执行（render 函数不存在）'}
      else if(window.__errs&&window.__errs.length){msg='render 过程中报错（见上方错误）'}
      else{msg='内容区域为空，render() 似乎没有被调用'}
      if(window.__errs)window.__errs.push(msg);else window.__errs=[msg];
      window.__showErr();
    }
  },1500);
})();
</script>
